name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# Only contents:write -- publishing is a branch push, not a Pages API call. The Pages
# deploy actions need a pages:write token this repo does not grant, which is why this
# workflow writes the built site to the gh-pages branch instead.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vite.config.js reads GITHUB_ACTIONS to switch base to /my-3d-test/
      - run: node scripts/publish.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
